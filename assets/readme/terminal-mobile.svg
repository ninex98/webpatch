<title id="title">WebPatch readable CLI output</title>
<desc id="desc">Complete actual installed CLI output. Empty inventory stays UNKNOWN. No JSON wall or synthetic diagnosis.</desc>
<rect x="1" y="1" width="478" height="770" rx="14" fill="#0b1525" stroke="#2d455e"/><text x="20" y="31" fill="#9ab3cc" font-size="12" font-weight="600" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" >WEBPATCH / ACTUAL CLI</text><path d="M1 48H479" stroke="#263c52"/><text x="20" y="82" fill="#63dcea" font-size="14" font-weight="600" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  WebPatch 0.2.0  /  PHP security check</text><text x="20" y="104" fill="#8097af" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  ────────────────────────────────────────</text><text x="20" y="126" fill="#8097af" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  Ubuntu 24.04  ·  current container</text><text x="20" y="148" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve"></text><text x="20" y="170" fill="#f0f6fc" font-size="14" font-weight="600" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  Result</text><text x="20" y="192" fill="#eab873" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  UNKNOWN  ·  Runtime safety is not</text><text x="20" y="214" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  established</text><text x="20" y="236" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  No PHP packages or runtime hints were</text><text x="20" y="258" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  found.</text><text x="20" y="280" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  An empty inventory does not prove the</text><text x="20" y="302" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  runtime is absent.</text><text x="20" y="324" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  0 packages  ·  0 observed processes  ·  0</text><text x="20" y="346" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  package versions unknown</text><text x="20" y="368" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve"></text><text x="20" y="390" fill="#f0f6fc" font-size="14" font-weight="600" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  What still needs checking</text><text x="20" y="412" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  • Custom installations, hidden processes</text><text x="20" y="434" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  and other containers are not fully</text><text x="20" y="456" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  covered.</text><text x="20" y="478" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve"></text><text x="20" y="500" fill="#f0f6fc" font-size="14" font-weight="600" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  Next step</text><text x="20" y="522" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  Confirm where PHP is installed. For</text><text x="20" y="544" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  containers, scan inside the target</text><text x="20" y="566" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  container.</text><text x="20" y="588" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  No package repair is available from this</text><text x="20" y="610" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  inventory.</text><text x="20" y="632" fill="#63dcea" font-size="14" font-weight="600" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">    webpatch scan --details</text><text x="20" y="654" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve"></text><text x="20" y="676" fill="#8097af" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  Read-only · no system changes</text><text x="20" y="698" fill="#8097af" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  Rules valid until:</text><text x="20" y="720" fill="#c5d3e5" font-size="14" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" xml:space="preserve">  2026-10-29T00:00:00+00:00</text><text x="20" y="757" fill="#9ab3cc" font-size="11" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" >UBUNTU 24.04 · ARM64 · 2026-10-23</text>
