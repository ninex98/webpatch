[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webpatch"
dynamic = ["version"]
description = "Conservative, evidence-driven web runtime security inventory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
webpatch = "webpatch.cli:main"

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov==6.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "webpatch.__version__"}

[tool.setuptools.package-data]
webpatch = ["data/*.json", "data/*.php"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
